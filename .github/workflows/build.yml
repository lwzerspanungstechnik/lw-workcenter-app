name: LW Workcenter APK bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt entpacken
        env:
          PROJECT_B64: ""
        run: |
          echo "$PROJECT_B64" | base64 -d > proj.tgz
          tar xzf proj.tgz
          ls -R . | head -40
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK Pakete
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk LW-Workcenter.apk
      - name: Als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1
          name: LW Workcenter App
          files: LW-Workcenter.apk
